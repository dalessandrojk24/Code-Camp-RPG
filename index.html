<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./styles.css">
    <title>RPG - Dragon Repeller</title>
    
  </head>
  <body>
    <div id="inventoryMenu" style="display: none">
      <h1> Menu</h1>
      <h2> Inventory</h2>
      <ul id="inventoryList">
      </ul>
      <button id="discardButton">Discard</button>
      <button id="equipButton">Equip</button>
      <h2> Equipment</h2>
      <ul id="equipmentList">
        <li id="equipWeapon" data-category="weapon">Weapon: </li>
        <li id="equipShield" data-category="shield">Shield: </li>
        <li id="equipRing" data-category="ring">Ring: </li>
      </ul>
      <button id="unequipButton">Unequip</button>
    </div>
    <div id="game">
      <h1 id="gameTitle">Dope A$$ Game</h1>
      <div id="controls">
        <button id="button1">Inventory</button>
      </div>
      <div id="text">
        Welcome to Dragon Repeller. You must defeat the dragon that is preventing people from leaving the town. You are in the town square. Where do you want to go? Use the buttons above.
      </div>
      <div id="image-container"></div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
